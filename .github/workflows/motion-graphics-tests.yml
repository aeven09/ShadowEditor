name: Documentary motion graphics MVP

on:
  push:
    branches: ["**"]
    paths:
      - "motion-graphics/**"
      - "tools/motion-graphics.mjs"
      - "tools/motion-editor-server.mjs"
      - "tools/motion-editor/**"
      - "tests/motion-graphics.test.mjs"
      - ".agents/skills/free247editor/SKILL.md"
      - "README.md"
      - ".github/workflows/motion-graphics-tests.yml"
  pull_request:
    paths:
      - "motion-graphics/**"
      - "tools/motion-graphics.mjs"
      - "tools/motion-editor-server.mjs"
      - "tools/motion-editor/**"
      - "tests/motion-graphics.test.mjs"
      - ".agents/skills/free247editor/SKILL.md"
      - "README.md"
      - ".github/workflows/motion-graphics-tests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check tools/motion-graphics.mjs
          node --check tools/motion-editor-server.mjs
          node --check tools/motion-editor/editor.js
          node --check tests/motion-graphics.test.mjs
      - name: Run motion graphics tests
        run: node --test tests/motion-graphics.test.mjs
      - name: Fetch pinned Herk Edit Kit
        run: |
          git clone --quiet --no-checkout --depth 1 --filter=blob:limit=1m https://github.com/nateherkai/herk-edit-kit.git kit
          git -C kit fetch --quiet --depth 1 --filter=blob:limit=1m origin 10511e5af86fc47756ea89803b397422e2d89284
          git -C kit sparse-checkout set --no-cone '/*' '!/examples/showcase/' '!/video-projects/**/*.mp4' '!/video-projects/**/*.mov' '!/video-projects/**/*.webm' '!/video-projects/**/*.mp3' '!/video-projects/**/*.wav'
          git -C kit -c advice.detachedHead=false checkout --quiet 10511e5af86fc47756ea89803b397422e2d89284
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci --no-audit --no-fund
      - name: Build documentary headline composition
        run: node tools/motion-graphics.mjs build
      - name: Lint generated composition
        working-directory: kit/video-projects/shadoweditor-documentary-headline
        run: |
          npx hyperframes lint
          node ../../scripts/preflight.mjs .
      - name: Install FFmpeg for draft rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render draft MP4
        working-directory: kit/video-projects/shadoweditor-documentary-headline
        run: npx hyperframes render --quality draft --output renders/headline-draft.mp4
      - name: Upload draft render artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadoweditor-headline-draft
          path: kit/video-projects/shadoweditor-documentary-headline/renders/headline-draft.mp4
          if-no-files-found: error
          retention-days: 7
